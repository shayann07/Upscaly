<!doctype html>
<html
  lang="en"
  style="background: repeating-linear-gradient(115deg, #171514 0 13px, #0b0a09 13px 26px)"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-384.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upscaly Studio — AI Image & Video Upscaler</title>
    <style>
      /*
        Inlined, not imported. Everything here has to paint on the very
        first frame, before the stylesheet or the ~450KB of JS have been
        fetched and parsed -- which on a slow disk or a cold WebView2 is
        the entire window of time the user is staring at the app.

        Values are copied from the tokens in src/index.css rather than
        invented, because this markup cannot import them: --bg-stripe for
        the background, --text-primary #F2F0ED, --text-muted #6B655E,
        --accent #A80B24, and --ease-spring for motion. The background in
        particular has to be the *striped* one: a flat fill meant the
        backdrop visibly changed the moment the app took over.
      */
      /*
        Declared here as well as in src/index.css, pointing at the same
        files under /fonts. The bundled stylesheet has not loaded when this
        markup paints, so without these the splash rendered its wordmark in
        Segoe UI and its status line in a generic mono -- visibly not the
        app's type, and then swapping once the bundle arrived.

        Both stylesheets use the same URLs, so the browser fetches each
        file once and the swap never happens.

        `block` rather than `swap`: a brief invisible moment is better here
        than showing the wrong typeface and then changing it under the
        user, which is exactly the flicker this is fixing.
      */
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-weight: 400 700;
        font-display: block;
        src: url('/fonts/Archivo-Variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Martian Mono';
        font-style: normal;
        font-weight: 400 500;
        font-display: block;
        src: url('/fonts/MartianMono-Variable.woff2') format('woff2');
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: repeating-linear-gradient(115deg, #171514 0 13px, #0b0a09 13px 26px);
      }

      /*
        Hidden until the app says it is ready. React mounts as soon as the
        bundle executes -- long before the GPU list or saved settings
        arrive -- so without this a half-built dashboard is briefly on
        screen underneath.
      */
      #root {
        visibility: hidden;
      }
      #root.app-ready {
        visibility: visible;
      }
      /* The staggered choreography belongs to the hand-over from the
         splash, which is a deliberate, watched moment. */
      #root.app-entering {
        animation: app-in 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) both;
      }
      /*
        A warm start gets a fade too -- shorter, and without the stagger.

        It used to get nothing at all: `visibility` flipped and the entire
        dashboard arrived in a single frame, straight off an empty striped
        window. That hard cut is what read as a blink. The earlier note
        here blamed animating for the stutter, but the real culprit was
        mount-time motion inside the app racing this reveal (see
        StudioPreviewSection); with that fixed, one short fade is the
        calmest way in.

        Short on purpose. This runs on every launch, and anything longer
        turns a 100ms start into a wait.
      */
      #root.app-revealing {
        animation: app-in 0.18s ease both;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /*
          The app's own striped backdrop, plus a soft radial pool behind
          the lockup. The stripes are deliberately busy -- in the app they
          always sit behind panels, never behind bare text -- so without
          this the wordmark and status line fight the pattern for contrast.
        */
        background:
          radial-gradient(
            ellipse 46% 42% at 50% 47%,
            rgba(11, 10, 9, 0.94) 0%,
            rgba(11, 10, 9, 0.72) 45%,
            rgba(11, 10, 9, 0) 100%
          ),
          repeating-linear-gradient(115deg, #171514 0 13px, #0b0a09 13px 26px);
        /*
          Invisible until the app decides startup is actually slow. A warm
          start finishes inside this window and hands over without the
          splash ever painting, which is why there is no flash to hide.
          Nothing shows through in the meantime because #root is hidden and
          this background matches the window's own.
        */
        opacity: 0;
      }
      #boot.boot-show {
        animation: boot-in 0.32s ease both;
      }
      #boot.boot-leave {
        animation: boot-out 0.34s cubic-bezier(0.4, 0, 0.9, 0.4) both;
      }

      /*
        Sized in vmin so the lockup scales with the *smaller* window
        dimension -- it can never overflow a short or narrow window the way
        vw alone would. clamp() keeps it sane at both extremes and, unlike
        breakpoints, scales continuously with no snapping as the window is
        dragged.
      */
      /*
        Two animations on one element: the entrance runs once, then the
        idle loop takes over. Both are on the <img> because the mark is a
        raster now -- the previous version animated an individual SVG face,
        which no longer exists.

        The idle motion replaces a progress bar deliberately: it suits an
        isometric solid, and it never has to invent a percentage for work
        whose duration is genuinely unknown.

        There is deliberately no glow. A drop-shadow traces the PNG's alpha
        silhouette, so animating its blur radius reads as an expanding
        blurred disc rather than light coming off the cube -- and the mark
        already carries its own gradients and shading.
      */
      #boot .boot-mark {
        width: clamp(104px, 19vmin, 208px);
        height: auto;
        transform-origin: 50% 50%;
        animation:
          mark-in 0.62s cubic-bezier(0.22, 1.15, 0.36, 1) both,
          mark-idle 3.6s ease-in-out 0.62s infinite;
      }

      /* Scaled up from the app's 13px panel-title step, since this is the
         only thing on screen rather than one label among many. */
      #boot .boot-name {
        margin-top: clamp(20px, 3.2vmin, 34px);
        font-family: Archivo, 'Segoe UI', system-ui, sans-serif;
        font-size: clamp(18px, 3vmin, 30px);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #f2f0ed;
        animation: text-in 0.5s cubic-bezier(0.22, 1.15, 0.36, 1) 0.16s both;
      }
      /*
        Anchored to the bottom of the window rather than sitting under the
        wordmark. It is a running commentary on what the app is doing, not
        part of the brand lockup, and pinning it low keeps the mark and
        wordmark as a single clean unit in the centre.
      */
      #boot .boot-status {
        position: absolute;
        left: 0;
        right: 0;
        bottom: clamp(26px, 6vmin, 64px);
        text-align: center;
        font-family: 'Martian Mono', ui-monospace, Consolas, monospace;
        font-size: clamp(9px, 1.25vmin, 11.5px);
        font-weight: 400;
        letter-spacing: 0.1em;
        color: #6b655e;
        min-height: 1em;
        animation:
          text-in 0.5s cubic-bezier(0.22, 1.15, 0.36, 1) 0.28s both,
          status-breathe 2.1s ease-in-out 0.78s infinite;
      }

      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      /* Lifts and recedes slightly on the way out, so it reads as making
         way for the app rather than simply switching off. */
      @keyframes boot-out {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(1.04);
        }
      }
      @keyframes mark-in {
        from {
          opacity: 0;
          transform: scale(0.86) translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes mark-idle {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-4px) scale(1.02);
        }
      }
      @keyframes text-in {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes status-breathe {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      /*
        Opacity only -- deliberately no transform.

        The app's root layout is `position: fixed; inset: 0`, and #root
        itself is therefore zero-height. An element with a running or
        filled `transform` animation becomes the containing block for its
        fixed descendants, so animating #root's transform laid the whole
        app out inside a 0px-tall box: the splash faded away and left an
        empty window. `filter`, `perspective`, `contain` and `will-change`
        do the same thing; `opacity` does not.
      */
      @keyframes app-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark,
        #boot .boot-name,
        #boot .boot-status,
        #root.app-entering {
          animation: none;
        }
        #boot.boot-show {
          animation: boot-in 0.01s linear both;
        }
        #boot.boot-leave {
          animation: boot-out 0.01s linear both;
        }
      }
    </style>
  </head>
