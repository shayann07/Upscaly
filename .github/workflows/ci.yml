name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is the platform this app ships on, and much of the backend is
    # Windows-specific -- the DXGI VRAM query, job objects, ntdll process
    # suspend, CREATE_NO_WINDOW. Running CI anywhere else would skip exactly
    # the code most likely to break.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # tauri.conf.json declares three sidecars under externalBin, and the
      # Tauri build script refuses to run if any of them is missing. That is
      # every CI checkout: the real binaries are third-party executables
      # totalling ~500MB and are deliberately not in git (.gitignore: *.exe),
      # so every cargo command here died in the build script with
      # "resource path binaries\... doesn't exist" and exit code 101. It is
      # why this workflow had never once gone green.
      #
      # Empty placeholders satisfy the existence check, which is all that is
      # needed: this job type-checks, lints and runs unit tests, none of
      # which spawn the engine, ffmpeg or ffprobe. Anything that actually
      # executes a sidecar would need the real thing and does not belong
      # here. Existing files are never overwritten, so a future workflow that
      # fetches the real binaries can reuse this step untouched.
      - name: Stub sidecar binaries for check-only build
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for name in realesrgan-ncnn-vulkan ffmpeg ffprobe; do
            path="src-tauri/binaries/${name}-x86_64-pc-windows-msvc.exe"
            if [ -f "$path" ]; then
              echo "present: $path"
            else
              : > "$path"
              echo "stubbed: $path"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri's build script needs the frontend dist directory to exist even
      # for check-only runs.
      - name: Build frontend
        run: npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The IPC types in src/lib/ipc are generated from the Rust structs.
      # Regenerating and diffing catches a backend shape change that the
      # committed bindings (and therefore the frontend) have not caught up
      # with -- the drift class that produced the duplicated model catalogs,
      # the two output-path schemes and the two status vocabularies.
      - name: Check generated IPC types are current
        shell: bash
        run: |
          npm run gen:types
          if ! git diff --quiet -- src/lib/ipc; then
            echo "::error::src/lib/ipc is stale. Run 'npm run gen:types' and commit the result."
            git diff -- src/lib/ipc
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (frontend)
        run: npx eslint src --max-warnings 999

      - name: Test (frontend)
        run: npx vitest run

      - name: Format check
        run: npm run format:check:all

      # Warnings are denied here rather than merely reported: the crate-level
      # allow that used to neutralize the whole lint policy was only caught by
      # an audit, and nothing would have stopped it coming back.
      - name: Clippy (backend)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test (backend)
        run: cargo test --manifest-path src-tauri/Cargo.toml
