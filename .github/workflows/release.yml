name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Every push to main runs this, but only a version bump should publish.
  # Comparing tauri.conf.json against the tags that already exist is what
  # makes "push to main and get a release" safe: docs commits, refactors
  # and merges do not produce releases, and re-running a workflow cannot
  # publish the same version twice.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new; releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Install frontend dependencies and fetch required engine sidecar
      - name: Setup dependencies & sidecar binaries
        run: |
          npm ci
          node scripts/fetch-sidecars.mjs realesrgan-ncnn-vulkan

      - name: Build installer
        env:
          # Signs the updater artifact. Without these the build still
          # produces an installer but errors at the end, and latest.json
          # would be unusable by the updater plugin.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: npm run tauri:build

      # latest.json is what tauri-plugin-updater fetches from the release's
      # `latest` alias. It has to be generated rather than hand-written
      # because it carries the detached signature the bundler just produced.
      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # NSIS names the artifact after productName, which contains a space.
          # GitHub rewrites asset filenames on upload, so publish under a
          # deterministic space-free name and point latest.json at exactly that.
          bundle="src-tauri/target/release/bundle/nsis"
          orig=$(ls "$bundle"/*-setup.exe)
          asset="$bundle/Upscaly-Studio_${VERSION}_x64-setup.exe"
          mv "$orig" "$asset"
          mv "$orig.sig" "$asset.sig"
          case "$(basename "$asset")" in (*' '*) echo "::error::asset name contains a space"; exit 1;; esac
          sig=$(cat "$asset.sig")
          # Subject line only. `%B | head -20` cut long commit bodies at an
          # arbitrary line, and the v0.1.0 release shipped a notes field
          # ending mid-sentence -- which is the text the in-app update
          # dialog shows verbatim. The full notes live on the release page.
          notes=$(git log -1 --pretty=%s)
          node -e '
            const fs = require("fs");
            const [version, sig, url, notes] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: sig, url } },
            }, null, 2));
          ' "$VERSION" "$sig" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$asset")" \
            "$notes"
          cat latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/release/bundle/nsis"
          gh release create "v${VERSION}" \
            --title "Upscaly Studio v${VERSION}" \
            --generate-notes \
            "$bundle"/*-setup.exe \
            "$bundle"/*-setup.exe.sig \
            latest.json
